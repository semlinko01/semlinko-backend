name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build TWA
        run: |
          bubblewrap init --manifest=https://semlinko-app2.onrender.com/manifest.json --directory=android-app
          cd android-app
          bubblewrap build

      - name: Upload APK & AAB
        uses: actions/upload-artifact@v3
        with:
          name: semlinko-android-build
          path: |
            android-app/*.apk
            android-app/*.aab
