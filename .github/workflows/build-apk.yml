name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA App
        run: |
          npx @bubblewrap/cli init --manifest=https://semlinko-app2.onrender.com/manifest.json --directory=android-twa --signing.keyPath="" || true
          cd android-twa || exit 0

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semlinko-android-build
          path: |
            android-twa/app/build/outputs/apk/*
            *.apk
