name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Android APK/AAB via PWABuilder
        uses: pwa-builder/pwa-action@v1.0
        with:
          manifest-url: 'https://semlinko-app2.onrender.com/manifest.json'
          output-dir: 'dist'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semlinko-android-build
          path: dist/*
